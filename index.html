<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandicapAI v8.26</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #2563eb;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 8px 12px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button.secondary {
      background-color: #475569;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.88rem;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #0f172a;
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .decision-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .badge-overlay { background-color: #2e7d32; color: #ffffff; }
    .badge-lonespeed { background-color: #e65100; color: #ffffff; }
    .badge-vulnerable { background-color: #c62828; color: #ffffff; }

    .fair-odds {
      font-weight: bold;
      color: #38bdf8;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .version-tag {
      font-size: 0.9rem;
      color: var(--text-muted);
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-flex" style="margin-bottom: 20px;">
    <h1>HandicapAI</h1>
    <div class="version-tag">v8.26 &bull; October 2026</div>
  </div>

  <!-- Race Context Setup -->
  <div class="card">
    <h2>Race Context Parameters</h2>
    <div class="grid-4">
      <div>
        <label for="distance">Distance (Furlongs)</label>
        <input type="number" id="distance" step="0.5" value="6.0">
      </div>
      <div>
        <label for="surface">Surface</label>
        <select id="surface">
          <option value="DIRT">Dirt</option>
          <option value="TURF">Turf</option>
          <option value="SYNTHETIC">Synthetic</option>
        </select>
      </div>
      <div>
        <label for="paceScenario">Pace Scenario</label>
        <select id="paceScenario">
          <option value="FAST">Fast / Contested</option>
          <option value="AVERAGE" selected>Average</option>
          <option value="SLOW">Slow / Uncontested</option>
        </select>
      </div>
      <div>
        <label for="trackCondition">Track Condition</label>
        <select id="trackCondition">
          <option value="FAST">Fast / Firm</option>
          <option value="OFF">Wet / Off Track</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions" style="margin-bottom: 20px;">
    <button onclick="runHandicapper()">Run Handicapper Engine</button>
    <button class="secondary" onclick="loadSampleData()">Load Sample Race</button>
  </div>

  <!-- Decision Board Output -->
  <div class="card">
    <h2>Handicapping Decision Board</h2>
    <div style="overflow-x: auto;">
      <table id="outputTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Horse Name</th>
            <th>ML Odds</th>
            <th>Fair Odds</th>
            <th>Base PP</th>
            <th>Adj. PP</th>
            <th>Style</th>
            <th>E-Pace</th>
            <th>Decision Flags</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="9" style="text-align: center; color: var(--text-muted);">
              Click "Run Handicapper Engine" or "Load Sample Race" to display evaluation.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let currentField = [];

  function oddsDecimal(oddsStr) {
    if (!oddsStr) return 2.0;
    const clean = oddsStr.toString().trim();
    if (clean.includes('/')) {
      const [num, den] = clean.split('/').map(Number);
      return (num / den) + 1.0;
    }
    const val = parseFloat(clean);
    return isNaN(val) ? 2.0 : val + 1.0;
  }

  function decimalToFractional(decimalOdds) {
    const profit = decimalOdds - 1.0;
    if (profit <= 0) return "1/9";
    
    const standardFractions = [
      { f: "1/5", v: 0.2 }, { f: "2/5", v: 0.4 }, { f: "1/2", v: 0.5 },
      { f: "3/5", v: 0.6 }, { f: "4/5", v: 0.8 }, { f: "1/1", v: 1.0 },
      { f: "6/5", v: 1.2 }, { f: "7/5", v: 1.4 }, { f: "3/2", v: 1.5 },
      { f: "8/5", v: 1.6 }, { f: "9/5", v: 1.8 }, { f: "2/1", v: 2.0 },
      { f: "5/2", v: 2.5 }, { f: "3/1", v: 3.0 }, { f: "7/2", v: 3.5 },
      { f: "4/1", v: 4.0 }, { f: "9/2", v: 4.5 }, { f: "5/1", v: 5.0 },
      { f: "6/1", v: 6.0 }, { f: "8/1", v: 8.0 }, { f: "10/1", v: 10.0 },
      { f: "12/1", v: 12.0 }, { f: "15/1", v: 15.0 }, { f: "20/1", v: 20.0 }
    ];

    let closest = standardFractions[0];
    let minDiff = Math.abs(profit - closest.v);

    for (let i = 1; i < standardFractions.length; i++) {
      const diff = Math.abs(profit - standardFractions[i].v);
      if (diff < minDiff) {
        minDiff = diff;
        closest = standardFractions[i];
      }
    }
    return closest.f;
  }

  function calculateAdjustedPrimePower(runner, raceContext) {
    let power = runner.basePrimePower || 100.0;

    if (runner.daysOff > 180) {
      const hasSharpWorkout = runner.lastWorkoutDays <= 14 && runner.lastWorkoutBullet;
      power -= hasSharpWorkout ? 2.5 : 5.0;
    } else if (runner.daysOff > 90) {
      power -= 1.5;
    }

    const isSprint = raceContext.distanceFurlongs < 8.0;
    if (isSprint) {
      if ((runner.runningStyle === 'E' || runner.runningStyle === 'E/P') && runner.ePaceRank === 1) {
        power += 3.5;
      }
    } else {
      if (raceContext.paceScenario === 'FAST' && (runner.runningStyle === 'P' || runner.runningStyle === 'S') && runner.lPaceRank <= 2) {
        power += 3.0;
      }
    }

    if (runner.classChangeStep > 0) {
      if (runner.top3FinishInLast3) {
        power += Math.min(runner.classChangeStep * 1.5, 4.5);
      }
    } else if (runner.classChangeStep < 0) {
      power += Math.max(runner.classChangeStep * 1.2, -4.0);
    }

    if (raceContext.surface !== runner.lastSurface) {
      const provenOnSurface = runner.surfaceWins > 0 || runner.surfaceTop3 > 1;
      if (!provenOnSurface) {
        power -= 3.0;
      }
    }

    return Math.round(power * 10) / 10;
  }

  function getDecisionBoardFlags(runner, field) {
    const flags = [];

    if (runner.mlOddsDecimal && runner.fairOddsDecimal) {
      const valueRatio = runner.mlOddsDecimal / runner.fairOddsDecimal;
      if (valueRatio >= 1.35) {
        flags.push({
          type: 'OVERLAY',
          label: '🎯 OVERLAY',
          class: 'badge-overlay',
          detail: `${valueRatio.toFixed(1)}x Value Ratio (ML ${runner.mlOdds} vs Fair ${runner.fairOddsStr})`
        });
      }
    }

    const sortedByPace = [...field].sort((a, b) => b.ePaceRating - a.ePaceRating);
    if (sortedByPace[0] && sortedByPace[0].id === runner.id) {
      const secondHighestPace = sortedByPace[1] ? sortedByPace[1].ePaceRating : 0;
      const paceGap = runner.ePaceRating - secondHighestPace;
      
      if (paceGap >= 7) {
        flags.push({
          type: 'LONE_SPEED',
          label: '⚡ LONE SPEED',
          class: 'badge-lonespeed',
          detail: `+${paceGap} E-Pace differential over runner-up`
        });
      }
    }

    const isMLFavorite = field.every(r => runner.mlOddsDecimal <= r.mlOddsDecimal);
    if (isMLFavorite) {
      const longLayoff = runner.daysOff > 150;
      const speedDeclining = runner.lastSpeedFig < (runner.avgSpeedFig - 8);
      const sharpClassRise = runner.classChangeStep < -2;

      if (longLayoff || speedDeclining || sharpClassRise) {
        const reason = longLayoff ? `${runner.daysOff}d Layoff` : 
                       speedDeclining ? 'Form Declining' : 'Sharp Class Step Up';
        flags.push({
          type: 'VULNERABLE_FAV',
          label: '⚠️ VULNERABLE FAV',
          class: 'badge-vulnerable',
          detail: `Fragile Morning Line Favorite (${reason})`
        });
      }
    }

    return flags;
  }

  function runHandicapper() {
    if (!currentField || currentField.length === 0) {
      loadSampleData();
      return;
    }

    const raceContext = {
      distanceFurlongs: parseFloat(document.getElementById('distance').value),
      surface: document.getElementById('surface').value,
      paceScenario: document.getElementById('paceScenario').value,
      trackCondition: document.getElementById('trackCondition').value
    };

    const sortedPace = [...currentField].sort((a, b) => b.ePaceRating - a.ePaceRating);
    currentField.forEach(runner => {
      runner.ePaceRank = sortedPace.findIndex(r => r.id === runner.id) + 1;
      runner.mlOddsDecimal = oddsDecimal(runner.mlOdds);
    });

    currentField.forEach(runner => {
      runner.adjPrimePower = calculateAdjustedPrimePower(runner, raceContext);
    });

    const totalPower = currentField.reduce((sum, r) => sum + Math.max(r.adjPrimePower, 50), 0);
    currentField.forEach(runner => {
      const prob = Math.max(runner.adjPrimePower, 50) / totalPower;
      runner.fairOddsDecimal = 1.0 / prob;
      runner.fairOddsStr = decimalToFractional(runner.fairOddsDecimal);
    });

    currentField.forEach(runner => {
      runner.flags = getDecisionBoardFlags(runner, currentField);
    });

    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    currentField.forEach(runner => {
      const tr = document.createElement('tr');

      const badgesHtml = runner.flags.map(f => 
        `<span class="decision-badge ${f.class}" title="${f.detail}">${f.label}</span>`
      ).join('');

      tr.innerHTML = `
        <td><strong>${runner.num}</strong></td>
        <td><strong>${runner.name}</strong></td>
        <td>${runner.mlOdds}</td>
        <td class="fair-odds">${runner.fairOddsStr} <small>(${runner.fairOddsDecimal.toFixed(2)})</small></td>
        <td>${runner.basePrimePower.toFixed(1)}</td>
        <td><strong>${runner.adjPrimePower.toFixed(1)}</strong></td>
        <td>${runner.runningStyle}</td>
        <td>${runner.ePaceRating}</td>
        <td>${badgesHtml || '<span style="color:var(--text-muted);">-</span>'}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  function loadSampleData() {
    currentField = [
      {
        id: 'h1', num: 1, name: 'Speed Demon', mlOdds: '4/1', basePrimePower: 128.5,
        runningStyle: 'E', ePaceRating: 108, lPaceRank: 4, daysOff: 28, lastWorkoutDays: 7,
        lastWorkoutBullet: true, classChangeStep: 0, top3FinishInLast3: true,
        lastSurface: 'DIRT', surfaceWins: 3, surfaceTop3: 5, lastSpeedFig: 92, avgSpeedFig: 90
      },
      {
        id: 'h2', num: 2, name: 'Rusty Favorite', mlOdds: '6/5', basePrimePower: 132.0,
        runningStyle: 'E/P', ePaceRating: 94, lPaceRank: 3, daysOff: 185, lastWorkoutDays: 20,
        lastWorkoutBullet: false, classChangeStep: -3, top3FinishInLast3: true,
        lastSurface: 'DIRT', surfaceWins: 2, surfaceTop3: 4, lastSpeedFig: 78, avgSpeedFig: 91
      },
      {
        id: 'h3', num: 3, name: 'Deep Closer', mlOdds: '8/1', basePrimePower: 124.0,
        runningStyle: 'S', ePaceRating: 78, lPaceRank: 1, daysOff: 42, lastWorkoutDays: 10,
        lastWorkoutBullet: false, classChangeStep: 1, top3FinishInLast3: true,
        lastSurface: 'TURF', surfaceWins: 0, surfaceTop3: 1, lastSpeedFig: 88, avgSpeedFig: 87
      },
      {
        id: 'h4', num: 4, name: 'Value Stalker', mlOdds: '6/1', basePrimePower: 130.0,
        runningStyle: 'P', ePaceRating: 95, lPaceRank: 2, daysOff: 21, lastWorkoutDays: 6,
        lastWorkoutBullet: true, classChangeStep: 2, top3FinishInLast3: true,
        lastSurface: 'DIRT', surfaceWins: 4, surfaceTop3: 7, lastSpeedFig: 94, avgSpeedFig: 92
      }
    ];

    runHandicapper();
  }

  window.onload = loadSampleData;
</script>

</body>
</html>
